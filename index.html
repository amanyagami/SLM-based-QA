<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF File Uploader</title>
    <style>
        :root {
            --color-white: rgba(255, 255, 255, 1);
            --color-cream-50: rgba(252, 252, 249, 1);
            --color-cream-100: rgba(255, 255, 253, 1);
            --color-gray-300: rgba(167, 169, 169, 1);
            --color-slate-500: rgba(98, 108, 113, 1);
            --color-brown-600: rgba(94, 82, 64, 1);
            --color-charcoal-700: rgba(31, 33, 33, 1);
            --color-charcoal-800: rgba(38, 40, 40, 1);
            --color-slate-900: rgba(19, 52, 59, 1);
            --color-teal-300: rgba(50, 184, 198, 1);
            --color-teal-500: rgba(33, 128, 141, 1);
            --color-teal-600: rgba(29, 116, 128, 1);
            --color-teal-700: rgba(26, 104, 115, 1);
            --color-red-500: rgba(192, 21, 47, 1);
            --color-red-400: rgba(255, 84, 89, 1);
            --color-brown-600-rgb: 94, 82, 64;
            --color-teal-500-rgb: 33, 128, 141;
            --color-slate-900-rgb: 19, 52, 59;
            --color-red-500-rgb: 192, 21, 47;
            --color-gray-400-rgb: 119, 124, 124;
            --color-teal-300-rgb: 50, 184, 198;
            --color-background: var(--color-cream-50);
            --color-surface: var(--color-cream-100);
            --color-text: var(--color-slate-900);
            --color-text-secondary: var(--color-slate-500);
            --color-primary: var(--color-teal-500);
            --color-primary-hover: var(--color-teal-600);
            --color-primary-active: var(--color-teal-700);
            --color-secondary: rgba(var(--color-brown-600-rgb), 0.12);
            --color-secondary-hover: rgba(var(--color-brown-600-rgb), 0.2);
            --color-border: rgba(var(--color-brown-600-rgb), 0.2);
            --color-btn-primary-text: var(--color-cream-50);
            --color-card-border: rgba(var(--color-brown-600-rgb), 0.12);
            --color-error: var(--color-red-500);
            --color-success: var(--color-teal-500);
            --color-success-rgb: 33, 128, 141;
            --color-error-rgb: 192, 21, 47;
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-size-base: 14px;
            --font-size-lg: 16px;
            --font-size-xl: 18px;
            --font-size-2xl: 20px;
            --font-size-3xl: 24px;
            --font-weight-medium: 500;
            --font-weight-semibold: 550;
            --line-height-tight: 1.2;
            --line-height-normal: 1.5;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-20: 20px;
            --space-24: 24px;
            --space-32: 32px;
            --radius-base: 8px;
            --radius-lg: 12px;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            --duration-fast: 150ms;
            --duration-normal: 250ms;
            --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);
            --focus-ring: 0 0 0 3px rgba(var(--color-teal-500-rgb), 0.4);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: var(--color-charcoal-700);
                --color-surface: var(--color-charcoal-800);
                --color-text: rgba(245, 245, 245, 1);
                --color-text-secondary: rgba(167, 169, 169, 0.7);
                --color-primary: var(--color-teal-300);
                --color-secondary: rgba(var(--color-gray-400-rgb), 0.15);
                --color-secondary-hover: rgba(var(--color-gray-400-rgb), 0.25);
                --color-border: rgba(var(--color-gray-400-rgb), 0.3);
                --color-btn-primary-text: var(--color-slate-900);
                --color-card-border: rgba(var(--color-gray-400-rgb), 0.2);
                --color-error: var(--color-red-400);
                --color-success: var(--color-teal-300);
                --color-success-rgb: 50, 184, 198;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family-base);
            font-size: var(--font-size-base);
            line-height: var(--line-height-normal);
            color: var(--color-text);
            background-color: var(--color-background);
            padding: var(--space-32);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background-color: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-card-border);
            box-shadow: var(--shadow-md);
            padding: var(--space-32);
        }

        h1 {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-semibold);
            line-height: var(--line-height-tight);
            margin-bottom: var(--space-8);
            color: var(--color-text);
        }

        .subtitle {
            font-size: var(--font-size-base);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-32);
        }

        .upload-area {
            border: 2px dashed var(--color-border);
            border-radius: var(--radius-base);
            padding: var(--space-32);
            text-align: center;
            background-color: var(--color-secondary);
            transition: all var(--duration-normal) var(--ease-standard);
            cursor: pointer;
            margin-bottom: var(--space-24);
        }

        .upload-area:hover {
            background-color: var(--color-secondary-hover);
            border-color: var(--color-primary);
        }

        .upload-area.drag-over {
            background-color: var(--color-secondary-hover);
            border-color: var(--color-primary);
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto var(--space-16);
            color: var(--color-primary);
        }

        .upload-text {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-medium);
            color: var(--color-text);
            margin-bottom: var(--space-8);
        }

        .upload-hint {
            font-size: var(--font-size-base);
            color: var(--color-text-secondary);
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            display: none;
            padding: var(--space-16);
            background-color: var(--color-secondary);
            border-radius: var(--radius-base);
            margin-bottom: var(--space-24);
            align-items: center;
            gap: var(--space-12);
        }

        .file-info.active {
            display: flex;
        }

        .file-icon {
            width: 32px;
            height: 32px;
            color: var(--color-error);
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: var(--font-weight-medium);
            color: var(--color-text);
            margin-bottom: 4px;
        }

        .file-size {
            font-size: 12px;
            color: var(--color-text-secondary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-12) var(--space-24);
            border-radius: var(--radius-base);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all var(--duration-normal) var(--ease-standard);
            border: none;
            width: 100%;
        }

        .btn:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .btn-primary {
            background: var(--color-primary);
            color: var(--color-btn-primary-text);
        }

        .btn-primary:hover {
            background: var(--color-primary-hover);
        }

        .btn-primary:active {
            background: var(--color-primary-active);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: var(--space-16);
            border-radius: var(--radius-base);
            margin-top: var(--space-24);
            font-weight: var(--font-weight-medium);
        }

        .message.active {
            display: block;
        }

        .message.success {
            background-color: rgba(var(--color-success-rgb), 0.15);
            color: var(--color-success);
            border: 1px solid rgba(var(--color-success-rgb), 0.25);
        }

        .message.error {
            background-color: rgba(var(--color-error-rgb), 0.15);
            color: var(--color-error);
            border: 1px solid rgba(var(--color-error-rgb), 0.25);
        }

        .code-section {
            margin-top: var(--space-32);
            padding-top: var(--space-32);
            border-top: 1px solid var(--color-border);
        }

        .code-title {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--space-16);
        }

        pre {
            background-color: var(--color-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            padding: var(--space-16);
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.6;
        }

        code {
            font-family: 'Courier New', monospace;
            color: var(--color-text);
        }
        /* Query UI styles */
        .query-section {
            margin-top: var(--space-24);
        }

        .query-title {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--space-12);
        }

        .query-input {
            width: 100%;
            min-height: 72px;
            padding: var(--space-12);
            border-radius: var(--radius-base);
            border: 1px solid var(--color-border);
            background-color: transparent;
            color: var(--color-text);
            margin-bottom: var(--space-12);
            resize: vertical;
        }

        .results-grid {
            display: grid;
            gap: var(--space-16);
        }

        .model-card {
            background-color: var(--color-secondary);
            border: 1px solid var(--color-border);
            padding: var(--space-12);
            border-radius: var(--radius-base);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: var(--space-12);
            align-items: start;
        }

        .responses {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-12);
            width: 100%;
        }

        .response-section {
            background: transparent;
            border-radius: var(--radius-base);
        }

        .response-text pre {
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }

        .preview-only {
            overflow: hidden;
        }

        .card-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .card-controls .btn {
            width: auto;
            padding: var(--space-8) var(--space-12);
        }

        .model-header {
            font-weight: var(--font-weight-medium);
            margin-bottom: 8px;
            color: var(--color-text);
        }

        .loading {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>PDF File Uploader</h1>
            <p class="subtitle">Upload PDF files to save them to the home directory</p>

            <form id="uploadForm">
                <div class="upload-area" id="uploadArea">
                    <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <div class="upload-text">Click to upload or drag and drop</div>
                    <div class="upload-hint">PDF files only (Max 16MB)</div>
                    <input type="file" id="fileInput" name="file" accept=".pdf,application/pdf">
                </div>

                <div class="file-info" id="fileInfo">
                    <svg class="file-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <div class="file-details">
                        <div class="file-name" id="fileName"></div>
                        <div class="file-size" id="fileSize"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="uploadBtn" disabled>Upload PDF</button>
            </form>

            <div class="message" id="message"></div>

            <div class="query-section" id="querySection">
                <h2 class="query-title">Ask a question</h2>
                <textarea id="queryInput" class="query-input" placeholder="Type your question here..."></textarea>
                <button type="button" class="btn btn-primary" id="queryBtn" disabled>Ask</button>
                <div class="message" id="queryMessage" style="margin-top:12px"></div>

                <div class="code-section" style="margin-top:16px;">
                    <div class="code-title">Model Responses</div>
                    <div id="results" class="results-grid"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadForm = document.getElementById('uploadForm');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const message = document.getElementById('message');

        let selectedFile = null;

        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // File selection
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;

            // Validate file type
            if (file.type !== 'application/pdf') {
                showMessage('Only PDF files are allowed', 'error');
                return;
            }

            // Validate file size (16MB)
            if (file.size > 16 * 1024 * 1024) {
                showMessage('File size must be less than 16MB', 'error');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('active');
            uploadBtn.disabled = false;
            message.classList.remove('active');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message active ' + type;
        }

        // Form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!selectedFile) {
                showMessage('Please select a file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', selectedFile);

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage(`Success! File saved to: ${data.path}`, 'success');
                    
                    // Reset form
                    setTimeout(() => {
                        fileInput.value = '';
                        fileInfo.classList.remove('active');
                        selectedFile = null;
                        uploadBtn.disabled = true;
                        uploadBtn.textContent = 'Upload PDF';
                    }, 3000);
                } else {
                    showMessage(data.error || 'Upload failed', 'error');
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'Upload PDF';
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload PDF';
            }
        });

        // Query UI
        const queryInput = document.getElementById('queryInput');
        const queryBtn = document.getElementById('queryBtn');
        const queryMessage = document.getElementById('queryMessage');
        const results = document.getElementById('results');

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        queryInput.addEventListener('input', () => {
            queryBtn.disabled = queryInput.value.trim() === '';
        });

        queryBtn.addEventListener('click', async () => {
            const q = queryInput.value.trim();
            if (!q) return;
            queryBtn.disabled = true;
            queryBtn.textContent = 'Asking...';
            queryMessage.className = 'message active';
            queryMessage.textContent = 'Loading...';
            results.innerHTML = '';

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    body: q,
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    queryMessage.className = 'message active error';
                    queryMessage.textContent = data.error || 'Query failed';
                    return;
                }

                queryMessage.className = 'message active success';
                queryMessage.textContent = 'Responses received';

                const respMap = data.responses || {};
                const baseModels = [];
                Object.keys(respMap).forEach((k) => {
                    const base = k.startsWith('Without Supermemory ') ? k.replace('Without Supermemory ', '') : k;
                    if (!baseModels.includes(base)) baseModels.push(base);
                });

                // Render a single card per model containing both With/Without Supermemory
                baseModels.forEach((base) => {
                    const withKey = base;
                    const withoutKey = 'Without Supermemory ' + base;
                    const withText = respMap[withKey] || '—';
                    const withoutText = respMap[withoutKey] || '—';

                    const card = document.createElement('div');
                    card.className = 'model-card';

                    const responsesWrapper = document.createElement('div');
                    responsesWrapper.className = 'responses preview-mode';

                    function makeResponseSection(title, fullText) {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'response-section';

                        const header = document.createElement('div');
                        header.className = 'model-header';
                        header.textContent = title;

                        const preview = document.createElement('div');
                        preview.className = 'response-text preview-only';

                        const truncated = (fullText || '').toString();
                        const max = 200;
                        const isLong = truncated.length > max;
                        const previewText = isLong ? truncated.slice(0, max) : truncated;

                        const prePreview = document.createElement('pre');
                        prePreview.className = 'preview';
                        prePreview.textContent = previewText + (isLong ? '... ' : '');

                        if (isLong) {
                            const readMore = document.createElement('a');
                            readMore.href = '#';
                            readMore.textContent = 'read more';
                            readMore.style.marginLeft = '6px';
                            readMore.addEventListener('click', (ev) => {
                                ev.preventDefault();
                                // trigger the card's toggle to expand so behavior matches button
                                const btn = card.querySelector('.card-controls .btn');
                                if (btn && btn.textContent === 'Show more') btn.click();
                            });
                            prePreview.appendChild(readMore);
                        }

                        const preFull = document.createElement('pre');
                        preFull.className = 'full-text';
                        preFull.style.display = 'none';
                        preFull.textContent = fullText;

                        preview.appendChild(prePreview);
                        preview.appendChild(preFull);

                        wrapper.appendChild(header);
                        wrapper.appendChild(preview);
                        return wrapper;
                    }

                    const leftSection = makeResponseSection('With Supermemory', withText);
                    const rightSection = makeResponseSection('Without Supermemory', withoutText);

                    responsesWrapper.appendChild(leftSection);
                    responsesWrapper.appendChild(rightSection);

                    const controls = document.createElement('div');
                    controls.className = 'card-controls';

                    const titleEl = document.createElement('div');
                    titleEl.textContent = base;
                    titleEl.className = 'model-header';

                    const toggleBtn = document.createElement('button');
                    toggleBtn.className = 'btn btn-primary';
                    toggleBtn.textContent = 'Show more';
                    toggleBtn.addEventListener('click', () => {
                        const expanded = card.classList.toggle('expanded');
                        if (expanded) {
                            toggleBtn.textContent = 'Show less';
                            // reveal full texts
                            const preFulls = card.querySelectorAll('.full-text');
                            preFulls.forEach(p => p.style.display = 'block');
                            // hide previews
                            card.querySelectorAll('.preview').forEach(p => p.style.display = 'none');
                        } else {
                            toggleBtn.textContent = 'Show more';
                            card.querySelectorAll('.full-text').forEach(p => p.style.display = 'none');
                            card.querySelectorAll('.preview').forEach(p => p.style.display = 'block');
                        }
                    });

                    controls.appendChild(titleEl);
                    controls.appendChild(toggleBtn);

                    card.appendChild(responsesWrapper);
                    card.appendChild(controls);
                    results.appendChild(card);
                });

            } catch (err) {
                queryMessage.className = 'message active error';
                queryMessage.textContent = 'Network error: ' + err.message;
            } finally {
                queryBtn.disabled = false;
                queryBtn.textContent = 'Ask';
            }
        });
    </script>
</body>
</html>
